<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | VoltAI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #07111f;
            color: white;
        }

        .login-container {
            width: 400px;
            padding: 40px;
            background: #0d1b2a;
            border: 1px solid #1d344d;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #00d4ff;
        }

        .subtitle {
            text-align: center;
            color: #9fb3c8;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #d8e5f0;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #29445d;
            border-radius: 10px;
            background: #091522;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #00d4ff;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #00d4ff;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #00d4ff;
            color: #06111d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .signup-text {
            text-align: center;
            margin-top: 25px;
            color: #9fb3c8;
        }

        .signup-text a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            background: #3a1720;
            color: #ff8fa3;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
        }

        .volt-icon {
            color: #00d4ff;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        <span class="volt-icon">⚡</span> VoltAI
    </div>

    <p class="subtitle">
        AI Electricity Bill Optimizer
    </p>

    {% if error %}
<div class="error" style="display: block;">
    {{ error }}
</div>
{% endif %}

    <form method="POST" action="/login">

        <div class="input-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="input-group">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()">
                    Show
                </button>

            </div>

        </div>


        <button type="submit" class="login-button">
            ⚡ Login to VoltAI
        </button>

    </form>


    <div class="signup-text">

        Don't have an account?

        <a href="/signup">
            Sign Up
        </a>

    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".show-password");

    if (password.type === "password") {

        password.type = "text";
        button.innerText = "Hide";

    } else {

        password.type = "password";
        button.innerText = "Show";

    }

}

</script>

</body>
</html>
